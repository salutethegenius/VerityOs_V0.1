services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: verityos-postgres
    environment:
      POSTGRES_USER: verityos
      POSTGRES_PASSWORD: verityos
      POSTGRES_DB: verityos_audit
    ports:
      - "5433:5432"
    volumes:
      - verityos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verityos -d verityos_audit"]
      interval: 5s
      timeout: 5s
      retries: 5

  mock-meta:
    profiles: ["stack", "demo"]
    image: node:20-bookworm
    working_dir: /workspace
    volumes:
      - .:/workspace
    command: bash -lc "node scripts/meta-mock.mjs"
    environment:
      META_MOCK_HOST: "0.0.0.0"
      META_MOCK_PORT: "8099"
    ports:
      - "8099:8099"

  core-api:
    profiles: ["stack", "demo"]
    image: node:20-bookworm
    working_dir: /workspace
    volumes:
      - .:/workspace
      - verityos_data:/var/verity-data
    command: bash -lc "pnpm --filter @verityos/core-api start"
    environment:
      DATABASE_URL: postgres://verityos:verityos@postgres:5432/verityos_audit
      PORT: "8080"
      CORS_ORIGIN: http://127.0.0.1:3000
      COOKIE_SECURE: "false"
      SESSION_SECRET: ${SESSION_SECRET:-compose-demo-session-secret-change-before-use}
      VERITY_PROFILE: ${VERITY_PROFILE:-development}
      VERITY_DEPLOYMENT_PROFILE: ${VERITY_PROFILE:-development}
      VERITY_EMBEDDING_PROVIDER: mock
      VERITY_DATA_DIR: /var/verity-data
      NOVA_INTERNAL_URL: http://nova:8090
      NOVA_INTERNAL_TOKEN: ${NOVA_INTERNAL_TOKEN:-}
      META_GRAPH_BASE: http://mock-meta:8099
      META_PAGE_ACCESS_TOKEN: ${META_PAGE_ACCESS_TOKEN:-fake-page-token}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mock-meta:
        condition: service_started

  nova:
    profiles: ["stack", "demo"]
    image: python:3.12-bookworm
    working_dir: /workspace
    volumes:
      - .:/workspace
    command: bash -lc "pip install -e apps/nova -q && NOVA_DEV_MODE=1 uvicorn verityos_nova.app.main:create_dev_app --factory --host 0.0.0.0 --port 8090"
    environment:
      NOVA_DEV_MODE: "1"
      DATABASE_URL: postgres://verityos:verityos@postgres:5432/verityos_audit
      CORE_API_URL: http://core-api:8080
      NOVA_SERVICE_TOKEN: ${NOVA_SERVICE_TOKEN:-}
      NOVA_ORGANIZATION_ID: ${NOVA_ORGANIZATION_ID:-}
      NOVA_SYSTEM_ACTOR_ID: ${NOVA_SYSTEM_ACTOR_ID:-}
      NOVA_INTERNAL_TOKEN: ${NOVA_INTERNAL_TOKEN:-}
      PYTHONPATH: /workspace/apps/nova/src
    ports:
      - "8090:8090"
    depends_on:
      - core-api

  shell:
    profiles: ["stack", "demo"]
    image: node:20-bookworm
    working_dir: /workspace
    volumes:
      - .:/workspace
    command: bash -lc "pnpm --filter @verityos/shell start"
    environment:
      CORE_API_URL: http://core-api:8080
      PORT: "3000"
      CORS_ORIGIN: http://127.0.0.1:3000
    ports:
      - "3000:3000"
    depends_on:
      - core-api

volumes:
  verityos_pgdata:
  verityos_data:
