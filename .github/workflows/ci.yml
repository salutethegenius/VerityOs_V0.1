name: CI

on:
  push:
    branches: ["main", "cursor/**"]
  pull_request:

jobs:
  typescript:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: verityos
          POSTGRES_PASSWORD: verityos
          POSTGRES_DB: verityos_audit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U verityos -d verityos_audit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://verityos:verityos@localhost:5432/verityos_audit
      VERITY_EMBEDDING_PROVIDER: mock
      VERITY_DATA_DIR: /tmp/verity-data
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install
      - run: pnpm db:migrate
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: verityos
          POSTGRES_PASSWORD: verityos
          POSTGRES_DB: verityos_audit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U verityos -d verityos_audit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://verityos:verityos@localhost:5432/verityos_audit
      VERITY_EMBEDDING_PROVIDER: mock
      VERITY_DATA_DIR: /tmp/verity-data
      CORS_ORIGIN: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install
      - run: pnpm db:migrate
      - run: pnpm build
      - run: python -m pip install --upgrade pip
      - run: python -m pip install uvicorn fastapi httpx "psycopg[binary]"
      - run: python -m pip install -e apps/nova
      - run: pnpm --filter @verityos/shell exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: verityos
          POSTGRES_PASSWORD: verityos
          POSTGRES_DB: verityos_audit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U verityos -d verityos_audit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://verityos:verityos@localhost:5432/verityos_audit
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install
      - run: pnpm db:migrate
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ruff pytest pytest-asyncio
      - run: python -m pip install -e apps/nova -e apps/knowledge -e packages/sdk-python
      - run: ruff check apps/nova apps/knowledge packages/sdk-python
      - run: pytest apps/nova apps/knowledge packages/sdk-python

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker build Audit Kernel image
        run: docker build -f infra/docker/audit-kernel.Dockerfile -t verityos-audit-kernel .
